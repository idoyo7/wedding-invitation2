name: Build and Push Docker Image (No Cache)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Docker Hub
  IMAGE_NAME: montkim9/invi2

  # montstrap repo / path
  MONTSTRAP_REPO: idoyo7/montstrap-manifest
  MONTSTRAP_APP_REPO: idoyo7/montstrap

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      # NOTE: image_tag output sometimes resolves empty in downstream jobs.
      # Derive it from short_sha to make it deterministic.
      image_tag: ${{ format('montkim9/invi2:{0}', steps.vars.outputs.short_sha) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract short SHA
        id: vars
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf "%s" "${GITHUB_SHA}" | cut -c1-6)"
          if [ -z "${SHORT_SHA}" ]; then
            echo "❌ SHORT_SHA is empty (GITHUB_SHA='${GITHUB_SHA:-}')" >&2
            exit 1
          fi

          IMAGE_TAG="${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "❌ IMAGE_TAG is empty" >&2
            exit 1
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "✅ Computed SHORT_SHA=${SHORT_SHA}"
          echo "✅ Computed IMAGE_TAG=${IMAGE_TAG}"

      - name: Debug step outputs
        run: |
          echo "steps.vars.outputs.short_sha='${{ steps.vars.outputs.short_sha }}'"
          echo "steps.vars.outputs.image_tag='${{ steps.vars.outputs.image_tag }}'"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push 되는 케이스 (push to main/master or workflow_dispatch 등)
      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # cache 끄고 싶으면 아래 두 줄 추가
          # no-cache: true
          # pull: true
          build-args: |
            NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest

      # PR은 push 없이 build만
      - name: Build Docker image (Pull Request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=test_key_for_pr
          tags: |
            ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
      - name: Build Summary
        if: always()
        run: |
          echo "### 📦 Wedding Invitation Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** \`linux/amd64\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          else
            echo "${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  update-manifests:
    name: Update montstrap / montstrap-manifest image tags
    needs: build-and-push
    runs-on: ubuntu-latest

    # main/master push에서만 실행
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: write

    env:
      SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
      # Don't rely on needs.*.outputs.image_tag (it may be empty); compute from SHORT_SHA.
      IMAGE_TAG: ${{ format('montkim9/invi2:{0}', needs.build-and-push.outputs.short_sha) }}

    steps:
      - name: Validate computed image tag (fail fast)
        run: |
          set -euo pipefail
          echo "SHORT_SHA='${SHORT_SHA}'"
          echo "IMAGE_TAG='${IMAGE_TAG}'"

          if [ -z "${IMAGE_TAG}" ]; then
            echo "❌ IMAGE_TAG is empty. Refusing to modify manifest." >&2
            exit 1
          fi

          case "${IMAGE_TAG}" in
            "${{ env.IMAGE_NAME }}:"*) ;;
            *)
              echo "❌ IMAGE_TAG does not match expected prefix '${{ env.IMAGE_NAME }}:'" >&2
              exit 1
              ;;
          esac

      - name: Checkout montstrap-manifest repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MONTSTRAP_REPO }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          path: montstrap-manifest

      - name: Update montstrap-manifest (hub kustomization x2 + edge deployment)
        id: update_manifests
        run: |
          set -euo pipefail
          cd montstrap-manifest

          # hub: 태그 전용 파일(kustomization images[].newTag)만 yq 로 bump — deployment.yaml(사람 편집)은 안 건드림.
          for K in \
            hub/wedding-app-external/manifests/kustomization.yaml \
            hub/wedding-app/manifests/kustomization.yaml; do
            [ -f "${K}" ] || { echo "❌ Kustomization not found: ${K}"; exit 1; }
            yq eval -i \
              '(.images[] | select(.name == "montkim9/invi2")).newTag = strenv(SHORT_SHA)' \
              "${K}"
            grep -q "newTag: ${SHORT_SHA}" "${K}" || { echo "❌ newTag not updated in ${K}"; exit 1; }
          done

          # edge: kustomize 미이관(plain apply) → deployment.yaml 의 image 줄만 sed
          D=edge/wedding-app-external/manifests/deployment.yaml
          [ -f "${D}" ] || { echo "❌ Deployment not found: ${D}"; exit 1; }
          sed -i 's|image: montkim9/invi2:.*|image: montkim9/invi2:'"${SHORT_SHA}"'|' "${D}"
          grep -q "image: montkim9/invi2:${SHORT_SHA}" "${D}" || { echo "❌ image not updated in ${D}"; exit 1; }

          git diff
          echo "changes_made=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes to montstrap-manifest
        if: steps.update_manifests.outputs.changes_made == 'true'
        run: |
          set -euo pipefail
          cd montstrap-manifest

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add hub/wedding-app-external/manifests/kustomization.yaml \
                  hub/wedding-app/manifests/kustomization.yaml \
                  edge/wedding-app-external/manifests/deployment.yaml
          git diff --cached --quiet || git commit -m "🚀 Update invi2 image tag to ${SHORT_SHA} (wedding-app hub/edge, wedding-app-external hub/edge)"

          # 공유 repo 동시푸시 경합 대비 rebase 재시도 x3
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          git push origin main

      # montstrap(별도 repo) 는 권한이 다를 수 있어 manifest 반영 뒤에 둔다. 실패하면 잡이 실패로 드러난다.
      - name: Checkout montstrap repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MONTSTRAP_APP_REPO }}
          token: ${{ secrets.MONTSTRAP_TOKEN || secrets.PERSONAL_GITHUB_TOKEN }}
          path: montstrap
          ref: main

      - name: Update montstrap edge deployment (we.montkim.com)
        id: update_montstrap
        run: |
          set -euo pipefail
          cd montstrap

          D=edge/wedding-invitation/manifests/deployment.yaml
          [ -f "${D}" ] || { echo "❌ Deployment not found: ${D}"; exit 1; }
          sed -i 's|image: montkim9/invi2:.*|image: montkim9/invi2:'"${SHORT_SHA}"'|' "${D}"
          grep -q "image: montkim9/invi2:${SHORT_SHA}" "${D}" || { echo "❌ image not updated in ${D}"; exit 1; }

          git diff
          echo "changes_made=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes to montstrap
        if: steps.update_montstrap.outputs.changes_made == 'true'
        run: |
          set -euo pipefail
          cd montstrap

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add edge/wedding-invitation/manifests/deployment.yaml
          git diff --cached --quiet || git commit -m "🚀 Update invi2 image tag to ${SHORT_SHA} (wedding-invitation edge)"

          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          git push origin main

      - name: Update Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Manifest Update Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Targets:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.MONTSTRAP_REPO }}\`: hub/wedding-app-external, hub/wedding-app (kustomization newTag), edge/wedding-app-external (deployment image)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.MONTSTRAP_APP_REPO }}\`: edge/wedding-invitation (deployment image)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.update_manifests.outputs.changes_made || 'false' }}" = "true" ]; then
            echo "✅ montstrap-manifest updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ montstrap-manifest: no changes (or step did not run)." >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.update_montstrap.outputs.changes_made || 'false' }}" = "true" ]; then
            echo "✅ montstrap updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ montstrap: no changes (or step did not run)." >> $GITHUB_STEP_SUMMARY
          fi

  deploy-ready:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build-and-push, update-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy notification
        run: |
          SHORT_SHA="${{ needs.build-and-push.outputs.short_sha }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

          echo "### 🎉 Wedding Invitation - Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker image built/pushed and manifest updated." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${IMAGE_TAG}\` (and \`${{ env.IMAGE_NAME }}:latest\`)" >> $GITHUB_STEP_SUMMARY
          echo "**Manifests:** \`${{ env.MONTSTRAP_REPO }}\` (hub x2, edge x1), \`${{ env.MONTSTRAP_APP_REPO }}\` (edge x1)" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

  failure-notification:
    if: failure()
    needs: [build-and-push, update-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Send Failure Notification
        run: |
          echo "### ❌ CI/CD Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA::8}\`" >> $GITHUB_STEP_SUMMARY
